name: Package

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    uses: normlanguage/registry/.github/workflows/package.yml@65133c580ca73ae29cff8fa798e6e369a773ff6f
    with:
      norm-version: 0.19.0
